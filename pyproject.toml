[project]
name = "quant-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-toon>=0.1.3",
    "click>=8.1.0",
    "finta>=1.3",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
quant = "src.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E: pycodestyle errors  F: pyflakes  W: pycodestyle warnings  I: isort
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
