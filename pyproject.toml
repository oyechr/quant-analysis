[build-system]
# 64+ for PEP 660 editable installs (pip install -e .)
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-analysis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-toon>=0.1.3",
    "click>=8.1.0",
    "finta>=1.3",
    "lxml>=5.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Required for 'quant chat'
llm = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
]
# Correlation heatmap in 'quant compare'
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
all = [
    "quant-analysis[llm,viz]",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    # Type information for mypy/Pylance; no runtime effect
    "pandas-stubs>=2.2.0",
    "types-requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
quant = "src.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "NPY", "RUF", "SIM", "UP"]
# E: pycodestyle errors  F: pyflakes  W: pycodestyle warnings  I: isort
# B: bugbear  C4: comprehensions  NPY: numpy  RUF: ruff  SIM: simplify  UP: pyupgrade
ignore = [
    "E501",  # line too long — handled by formatter
    "RUF001", "RUF002", "RUF003",  # ×, σ and – in text are deliberate
    "RUF022",  # __all__ lists are grouped by topic, not sorted
    "SIM108",  # a ternary isn't always clearer than if/else
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = "test_*.py"
# Import `src` and `tests` from the checkout, so no test edits sys.path
pythonpath = ["."]
# Unknown markers and config keys are errors, an xfail that passes fails,
# and parametrize ids must be unique
strict = true
# A new deprecation (pandas, numpy, yfinance) fails the run instead of scrolling past
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
strict_equality = true
no_implicit_reexport = true

# Libraries that ship no type information (no stubs exist for them)
[[tool.mypy.overrides]]
module = ["yfinance.*", "finta.*", "toon.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true
