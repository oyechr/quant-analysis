[project]
name = "quant-analysis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-toon>=0.1.3",
    "click>=8.1.0",
    "finta>=1.3",
    "lxml>=5.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Required for 'quant chat'
llm = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
]
# Correlation heatmap in 'quant compare'
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
all = [
    "quant-analysis[llm,viz]",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    # Type information for mypy/Pylance; no runtime effect
    "pandas-stubs>=2.2.0",
    "types-requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
quant = "src.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E: pycodestyle errors  F: pyflakes  W: pycodestyle warnings  I: isort
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# Libraries that ship no type information (no stubs exist for them)
[[tool.mypy.overrides]]
module = ["yfinance.*", "finta.*", "toon.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true
